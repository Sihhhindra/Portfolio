<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="scard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2233" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#121622" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" fill="url(#sbg)"/>

  <!-- Subtle Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="65" x2="680" y2="65"/>
    <line x1="0" y1="130" x2="680" y2="130"/>
    <line x1="0" y1="195" x2="680" y2="195"/>
    <line x1="0" y1="260" x2="680" y2="260"/>
    <line x1="0" y1="325" x2="680" y2="325"/>
    <line x1="0" y1="390" x2="680" y2="390"/>
    <line x1="0" y1="455" x2="680" y2="455"/>
    <line x1="85" y1="0" x2="85" y2="520"/>
    <line x1="170" y1="0" x2="170" y2="520"/>
    <line x1="255" y1="0" x2="255" y2="520"/>
    <line x1="340" y1="0" x2="340" y2="520"/>
    <line x1="425" y1="0" x2="425" y2="520"/>
    <line x1="510" y1="0" x2="510" y2="520"/>
    <line x1="595" y1="0" x2="595" y2="520"/>
  </g>

  <!-- Header Pill -->
  <rect x="50" y="45" width="260" height="36" rx="18" fill="#FFD54F" fill-opacity="0.15" stroke="#FFD54F" stroke-opacity="0.4"/>
  <circle cx="70" cy="63" r="6" fill="#FFD54F"/>
  <text x="86" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFD54F" letter-spacing="1.5">SRMJEEE MERIT SCHOLARSHIP</text>

  <!-- Main Headline -->
  <text x="50" y="130" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="800" fill="#fbfaf9">
    75% Merit Scholarship
  </text>
  <text x="50" y="165" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#9d9db2">
    Awarded by SRM Institute of Science and Technology for SRMJEEE Rank &amp; Academic Distinction
  </text>

  <!-- Award Plaque Box -->
  <rect x="50" y="200" width="580" height="275" rx="18" fill="url(#scard)" stroke="#FFD54F" stroke-opacity="0.25"/>

  <!-- Gold Seal Emblem -->
  <g transform="translate(100, 260)">
    <circle cx="45" cy="45" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="45" cy="45" r="36" fill="#141926" stroke="#FFD54F" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Star -->
    <path d="M45 23 L49 35 L62 35 L51 43 L55 55 L45 47 L35 55 L39 43 L28 35 L41 35 Z" fill="url(#goldGrad)"/>
    <text x="45" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFD54F" text-anchor="middle" letter-spacing="1">MERIT</text>
  </g>

  <!-- Plaque Details -->
  <text x="215" y="260" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#9d9db2">INSTITUTION</text>
  <text x="215" y="286" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#fbfaf9">SRM IST Kattankulathur</text>

  <text x="215" y="328" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#9d9db2">PROGRAM &amp; ACADEMIC CGPA</text>
  <text x="215" y="354" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#00E5FF">B.Tech Computer Science &amp; Engg · 9.16 CGPA</text>

  <!-- Bottom Distinction Banner -->
  <rect x="75" y="400" width="530" height="52" rx="10" fill="#0c0f18" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="95" y="432" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFD54F">★ Distinction:</text>
  <text x="185" y="432" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#e2e8f0">Granted 75% tuition scholarship recognition for exceptional SRMJEEE rank and merit</text>
</svg>
